name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle in app folder
        run: |
          cd app
          gradle init --type basic --automation-language groovy --dsl groovy --test-framework none --project-name "app" --non-interactive || true
          gradle assembleDebug
